name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JamesCarnley/nanda-index-v2
          ref: b9c6ccef4907c5dc3c7d9d898cf671207166f435
          path: index-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JamesCarnley/nandatown
          ref: bf8f226b4d7ae9543bd73995c000c64c7dcd7e09
          path: town-checkout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: npm ci
      - run: npm ci
        working-directory: index-checkout/server
      - name: Provision pinned Town interpreter
        run: |
          python -m venv "$GITHUB_WORKSPACE/town-venv"
          "$GITHUB_WORKSPACE/town-venv/bin/python" -m pip install -e "$GITHUB_WORKSPACE/town-checkout"
      - run: npm run check
        env:
          NANDA_INDEX_CHECKOUT: ${{ github.workspace }}/index-checkout
          NANDATOWN_CHECKOUT: ${{ github.workspace }}/town-checkout
          NANDATOWN_PYTHON: ${{ github.workspace }}/town-venv/bin/python
